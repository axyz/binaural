[package]
name = "binaural"
version = "0.1.3"
edition = "2024"
rust-version = "1.95"
description = "Binaural-beat audio player for Unix-like systems"
license = "MIT"
repository = "https://github.com/axyz/binaural"
homepage = "https://github.com/axyz/binaural"
readme = "README.md"
exclude = [".github/", ".gitignore", "RELEASING.md"]
keywords = ["audio", "binaural", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
kdl = "6.7.1"
rodio = { version = "0.22.2", features = ["noise"] }
signal-hook = "0.4.4"

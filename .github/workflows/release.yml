name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Validate tag
        id: metadata
        run: |
          version="$(cargo +stable metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "binaural") | .version')"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Validate source package
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --locked --all-targets --all-features -- -D warnings
          cargo +stable test --locked --all-targets --all-features
          cargo +stable publish --dry-run --locked
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - name: Build
        run: cargo +stable build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        run: |
          binary="target/${{ matrix.target }}/release/binaural"
          strip "$binary"
          "$binary" --version
          "$binary" presets
      - name: Package
        id: package
        run: |
          archive="binaural-${{ needs.prepare.outputs.version }}-${{ matrix.target }}"
          mkdir "$archive"
          cp "target/${{ matrix.target }}/release/binaural" README.md LICENSE "$archive/"
          tar -czf "$archive.tar.gz" "$archive"
          echo "asset=$archive.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Upload archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.asset }}" --clobber

  publish-crate:
    name: Publish crate
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev pkg-config
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Check registry
        id: registry
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          http_code="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/binaural/$VERSION")"
          case "$http_code" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io returned HTTP $http_code" >&2; exit 1 ;;
          esac
      - name: Authenticate to crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.registry.outputs.published == 'false'
        run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-release:
    name: Publish GitHub release
    needs: [prepare, build, publish-crate]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'binaural-*.tar.gz' --dir dist
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
